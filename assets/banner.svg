<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>

    <linearGradient id="emeraldPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.45" />
      <circle cx="40" cy="40" r="1" fill="#00f5ff" opacity="0.25" />
    </pattern>
  </defs>

  <!-- 1. Background -->
  <rect width="1280" height="380" fill="url(#bgGradient)" rx="16" />
  <rect width="1280" height="380" fill="url(#grid)" rx="16" />

  <!-- 2. Dynamic Scanning Laser Line (Background Layer) -->
  <line x1="0" y1="0" x2="1280" y2="0" stroke="url(#cyanNeon)" stroke-width="1.8" opacity="0.65" filter="url(#glow)">
    <animate attributeName="y1" values="20;360;20" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y2" values="20;360;20" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="8s" repeatCount="indefinite" />
  </line>

  <!-- Dynamic Ambient Glowing Orbs -->
  <circle cx="180" cy="190" r="160" fill="#0284c7" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="140;180;140" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1100" cy="180" r="170" fill="#ff7b00" opacity="0.1" filter="url(#glow)">
    <animate attributeName="r" values="150;190;150" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.06;0.15;0.06" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Flowing Circuit Lines -->
  <path d="M 60 90 L 220 90 L 260 130 L 420 130" fill="none" stroke="#00f5ff" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.35">
    <animate attributeName="stroke-dashoffset" values="0;-100" dur="5s" repeatCount="indefinite" />
  </path>
  <path d="M 860 250 L 1020 250 L 1060 210 L 1220 210" fill="none" stroke="#ff7b00" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.35">
    <animate attributeName="stroke-dashoffset" values="0;100" dur="5s" repeatCount="indefinite" />
  </path>
  <path d="M 120 290 L 300 290 L 340 330 L 500 330" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3">
    <animate attributeName="stroke-dashoffset" values="0;-80" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- 3. Top Badges / Status Pills (Dynamic Pulse, cleanly positioned above title) -->
  <g transform="translate(60, 42)">
    <!-- Pill 1: Lights-Out System Status -->
    <rect x="0" y="0" width="186" height="30" rx="15" fill="#0f172a" stroke="#00f5ff" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="15" r="5" fill="#00ff9d" filter="url(#subtleGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">LIGHTS-OUT ACTIVE</text>

    <!-- Pill 2: Unattended OEE -->
    <rect x="200" y="0" width="154" height="30" rx="15" fill="#0f172a" stroke="#10b981" stroke-width="1.2" opacity="0.9" />
    <circle cx="216" cy="15" r="5" fill="#10b981">
      <animate attributeName="r" values="4;6;4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="228" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1">TARGET OEE: 99.4%</text>

    <!-- Pill 3: Agentic Orchestration -->
    <rect x="368" y="0" width="180" height="30" rx="15" fill="#0f172a" stroke="#ff7b00" stroke-width="1.2" opacity="0.9" />
    <circle cx="384" cy="15" r="5" fill="#ff7b00" filter="url(#subtleGlow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="396" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#fb923c" letter-spacing="1">AGENTIC MES RUNNING</text>
  </g>

  <!-- 4. Foreground Main Title & Brand Identity (High Contrast, Guaranteed Clarity) -->
  <g transform="translate(60, 155)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#subtleGlow)">
      Awesome Dark Factory Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#94a3b8" letter-spacing="0.3">
      The Curated Ecosystem for Lights-Out Manufacturing, Autonomous Quality Inspection &amp; Agent-Driven Production
    </text>
  </g>

  <!-- 5. Feature Architecture Tags (Bottom Row, Fixed foreground positioning) -->
  <g transform="translate(60, 260)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">🤖 AUTONOMOUS CELLS</text>
      <text x="18" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Robotics &amp; Zero-Operator Assembly</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(234, 0)">
      <rect x="0" y="0" width="220" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">👁️ VISION &amp; AOI</text>
      <text x="18" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Real-time Defect Anomaly AI</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(468, 0)">
      <rect x="0" y="0" width="220" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fb923c">⚡ AGENTIC MES / SCADA</text>
      <text x="18" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">ISA-95 &amp; MCP Tool Pipelines</text>
    </g>

    <!-- Tag 4 -->
    <g transform="translate(702, 0)">
      <rect x="0" y="0" width="220" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e879f9">🌐 IIOT &amp; OPEN PROTOCOLS</text>
      <text x="18" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">OPC UA, MQTT Sparkplug &amp; PLC4X</text>
    </g>

    <!-- Tag 5 -->
    <g transform="translate(936, 0)">
      <rect x="0" y="0" width="220" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#facc15">🛡️ ZERO-TRUST OT</text>
      <text x="18" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Audit Spines &amp; Hardware Safety</text>
    </g>
  </g>

  <!-- Border accent highlight -->
  <rect x="1" y="1" width="1278" height="378" rx="16" fill="none" stroke="url(#cyanNeon)" stroke-width="1" opacity="0.3" />
</svg>
